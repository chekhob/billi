quarkus.http.port=8081
quarkus.console.enabled=false
quarkus.live-reload.instrumentation=true

quarkus.s3.devservices.enabled=false
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.region=eu-central
# quarkus.s3.endpoint-override=http://localhost:9000
# quarkus.s3.aws.credentials.static-provider.access-key-id=admin
# quarkus.s3.aws.credentials.static-provider.secret-access-key=password
quarkus.s3.endpoint-override=${BACKBLAZE_ENDPOINT}
quarkus.s3.aws.credentials.static-provider.access-key-id=${BACKBLAZE_KEY_ID}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${BACKBLAZE_SECRET}
# software.amazon.awssdk.regions.providers.AwsProfileRegionProvider
bucket.name=warehouse-end

#postgres
quarkus.datasource.postgres.db-kind=postgresql
quarkus.datasource.postgres.username=${POSTGRES_JDBC_USERNAME}
quarkus.datasource.postgres.password=${POSTGRES_JDBC_PASSWORD}
quarkus.datasource.postgres.jdbc.url=${POSTGRES_JDBC_URL}
quarkus.datasource.postgres.jdbc.max-size=16
quarkus.hibernate-orm.datasource=postgres
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# mongo
# configure the MongoDB client for a replica set of two nodes
# quarkus.mongodb.connection-string=${MONGO_DB_CONNECTION_STRING}
# quarkus.mongodb.database=${MONGO_DB_DATABASE_NAME}
# #quarkus.mongodb.retry-writes=false
# quarkus.mongodb.devservices.properties.directConnection=true;
# quarkus.mongodb.devservices.properties.retryWrites=false;



#Defaults
iceberg.format.version=2
iceberg.initial.spec-id=0
parquet.compression-code.default=zstd
